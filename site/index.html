<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e5f">
<meta name="description" content="整合中央氣象署雷達、雨量、定量降水預報、測站、登山與景點預報、地震與颱風資訊的台灣山岳氣象地圖">
<title>台灣山岳氣象地圖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/icons.css">
</head>
<body>
<a class="skip" href="#controls">跳至圖層控制</a>
<header class="topbar">
  <h1 class="brand"><span aria-hidden="true">⛰</span> 台灣山岳氣象地圖</h1>
  <form id="search-form" class="search" role="search">
    <label for="q" class="sr-only">搜尋山名、測站、鄉鎮或座標</label>
    <input id="q" type="search" autocomplete="off" placeholder="搜尋山名、測站、鄉鎮、座標" role="combobox" aria-expanded="false" aria-controls="q-results" aria-autocomplete="list">
    <ul id="q-results" role="listbox" hidden></ul>
  </form>
  <nav class="actions-top" aria-label="功能">
    <button id="btn-locate" class="icon-btn" data-short="定位" aria-label="定位到我的位置" title="我的位置"><span aria-hidden="true">◎</span></button>
    <button id="btn-typhoon" class="icon-btn ty-btn" data-short="颱風" aria-label="颱風警報生效中：查看颱風資訊" title="颱風警報" hidden><span aria-hidden="true">🌀</span><span class="ty-dot" aria-hidden="true"></span></button>
    <button id="btn-quake" class="icon-btn ty-btn eq-btn" data-short="地震" aria-label="近期地震：查看地震報告" title="近期地震" hidden><span aria-hidden="true">〰</span><span class="ty-dot" aria-hidden="true"></span></button>
    <button id="btn-alerts" class="icon-btn" data-short="警特報" aria-label="警特報與災害" title="警特報與災害"><span aria-hidden="true">⚠</span><span id="alert-badge" class="badge" hidden></span></button>
    <button id="btn-recent" class="icon-btn" data-short="收藏" aria-label="收藏與最近查詢" title="收藏與最近查詢"><span aria-hidden="true">★</span></button>
    <button id="btn-settings" class="icon-btn" data-short="設定" aria-label="顯示與無障礙設定" title="設定"><span aria-hidden="true">⚙</span></button>
  </nav>
</header>
<p id="status" class="status" role="status" aria-live="polite">載入中…</p>
<main id="map" aria-label="地圖。點擊任一處可查看該地的即時觀測、預報與安全評估"></main>

<section id="controls" class="controls" aria-label="圖層控制">
  <div id="chips" class="chips" role="radiogroup" aria-label="氣象圖層"></div>
  <div class="tools">
    <div id="time-ctl" class="time-ctl"></div>
    <button id="btn-bar-hide" class="btn bar-hide" aria-controls="controls" title="收合圖層列，地圖更大（可由地圖左下角「圖層」按鈕展開）"><span aria-hidden="true">▾</span> 收合</button>
  </div>
</section>
<!-- Map options: moved into the map's top-right corner as a Leaflet control at start-up. -->
<div id="map-opts" class="map-opts">
  <button id="btn-more" class="map-opts-btn" aria-expanded="false" aria-controls="more" title="圖層與顯示選項"><span aria-hidden="true">☰</span> 選項</button>
  <div id="more" class="more" role="group" aria-label="圖層與顯示選項">
    <label class="range">透明度 <input id="opacity" type="range" min="0.2" max="1" step="0.05" aria-valuetext="70%"></label>
    <label class="range">名稱字體 <input id="lbl-size" type="range" min="0.8" max="2" step="0.05"> <output id="lbl-size-out"></output></label>
    <div id="toggles" class="toggles" aria-label="標記"></div>
    <button id="btn-affected" class="btn">列出受影響山區</button>
    <div class="opts-ui"><span class="tog-lbl" id="opts-ui-t">介面</span><div id="opts-ui" class="seg" role="radiogroup" aria-labelledby="opts-ui-t"></div></div>
  </div>
</div>
<!-- Shown at the map's bottom-left while the layer bar is collapsed. -->
<button id="btn-bar-show" class="map-opts-btn bar-show" aria-controls="controls" hidden><span aria-hidden="true">▴</span> 圖層<span id="bar-show-layer"></span></button>
<div id="tabbar" class="tabbar"></div>
<details id="legend" class="legend" hidden></details>

<section id="sheet" class="sheet" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <div class="sheet-head">
    <span class="sheet-grab" aria-hidden="true"></span>
    <button id="sheet-back" class="icon-btn" aria-label="上一頁" hidden><span aria-hidden="true">‹</span></button>
    <h2 id="sheet-title"></h2>
    <button id="sheet-fav" class="icon-btn" aria-label="加入收藏" aria-pressed="false" title="加入收藏" hidden><span aria-hidden="true">☆</span></button>
    <button id="sheet-min" class="icon-btn" aria-label="縮小面板（保留地圖上的標示）" aria-expanded="true"><span aria-hidden="true">▾</span></button>
    <button id="sheet-toggle" class="icon-btn" aria-label="全螢幕展開面板" aria-expanded="false"><span aria-hidden="true">↕</span></button>
    <button id="sheet-close" class="icon-btn" aria-label="關閉面板"><span aria-hidden="true">✕</span></button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
  <form method="dialog" class="dlg-head"><h2 id="dlg-settings-title">設定</h2><button class="icon-btn" aria-label="關閉設定"><span aria-hidden="true">✕</span></button></form>
  <div class="dlg-body"></div>
</dialog>

<noscript><p class="noscript">此網頁需要啟用 JavaScript。</p></noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/topojson/topojson-client.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
