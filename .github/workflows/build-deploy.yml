name: Build data and deploy site

on:
  schedule:
    - cron: "*/20 * * * *"   # CWA radar/rain update every 10 min; forecasts 4x per day
  workflow_dispatch:
  push:
    paths: ["site/**", "pipeline/**", ".github/workflows/build-deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_TZ: Asia/Taipei
      FORCE_COLOR: "1"
      # Set the repository variable TYPHOON_TABLES=1 only after CWA grants written permission.
      TYPHOON_TABLES: ${{ vars.TYPHOON_TABLES }}
      # Optional: Thunderforest API key for the OpenCycleMap basemap (public by design).
      THUNDERFOREST_KEY: ${{ vars.THUNDERFOREST_KEY }}
    outputs:
      ok: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Restore download cache and history archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .cache
            site/data
            archive
          key: cwa-${{ github.run_id }}
          restore-keys: cwa-

      - name: Unit tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q tests

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Build data bundle
        id: build
        run: python -m pipeline.build --archive-seed-url "${{ steps.pages.outputs.base_url }}"

      - name: Save download cache and history archive
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .cache
            site/data
            archive
          key: cwa-${{ github.run_id }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 3

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: always() && hashFiles('site/data/manifest.json') != ''
        with:
          path: site

  deploy:
    needs: build
    # Only the repository's default branch may publish; other branches still build and run the tests.
    if: always() && needs.build.result != 'cancelled' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
